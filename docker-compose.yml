services:
  rysen_retargeting:
    image: ${RYSEN_RETARGETING_IMAGE}
    pull_policy: missing
    container_name: rysen_retargeting
    network_mode: host
    ipc: host
    privileged: true
    # Running as the desktop user lets X11 recognize this as a local process.
    # 1000 is the usual first Linux desktop user. Override RYSEN_UID/GID only
    # on systems using different numeric IDs.
    user: "${RYSEN_UID:-1000}:${RYSEN_GID:-1000}"
    restart: unless-stopped

    environment:
      ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:-111}"
      ROS_LOCALHOST_ONLY: "${ROS_LOCALHOST_ONLY:-0}"
      RMW_IMPLEMENTATION: "${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}"
      # DISPLAY is needed only for the MuJoCo + Tk calibration workflow.
      DISPLAY: "${DISPLAY:-}"
      HOME: /var/lib/teleoperation_hand/manus_home
      XDG_CONFIG_HOME: /var/lib/teleoperation_hand/manus_home/.config
      QT_X11_NO_MITSHM: "1"
      MUJOCO_GL: "${MUJOCO_GL:-glfw}"
      TELEOPERATION_HAND_CALIBRATION_DIR: /var/lib/teleoperation_hand/calibration

    volumes:
      # New JSON calibrations and active_profiles.json. Keep this directory when
      # upgrading images so the selected left/right calibration profiles remain.
      - ./calibration:/var/lib/teleoperation_hand/calibration:rw
      # MANUS Core local settings, generated by the runtime.
      - ./manus_config:/var/lib/teleoperation_hand/manus_home:rw
      - ./logs:/var/log/teleoperation_hand:rw
      - /dev:/dev
      - /run/udev:/run/udev:ro
      - /tmp/.X11-unix:/tmp/.X11-unix:rw

    command:
      - /opt/rysen-retargeting/app/scripts/start_manus_manager.sh
      - --ros-args
      - -p
      - log_dir:=/var/log/teleoperation_hand
